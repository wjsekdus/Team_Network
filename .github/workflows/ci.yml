# 기본 CI: Pull Request 와 main/develop 푸시마다 실행된다.
# 비밀 값(secrets) 없이 동작한다. 서버 테스트는 H2 + 임베디드 PostgreSQL(zonky)을 테스트 안에서 직접 띄운다.
name: CI

on:
  pull_request:
  push:
    branches: [ main, develop, 'prototype/**' ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test (server / shared / Android)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: 1. 소스 코드 체크아웃
        uses: actions/checkout@v4

      - name: 2. JDK 21 설정
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: 3. Gradle 설정 및 캐시
        uses: gradle/actions/setup-gradle@v4

      - name: gradlew 실행 권한 (Windows 에서 커밋된 경우 대비)
        run: chmod +x gradlew

      - name: 4. Kotlin 컴파일 (의존성 다운로드 포함)
        run: ./gradlew :shared:compileKotlinJvm :server:compileKotlin :composeApp:compileAndroidMain --stacktrace

      - name: 4-1. iOS Kotlin 교차 컴파일 (iosMain 문법·타입 검사, 링크·Xcode 빌드는 ios-build.yml)
        run: ./gradlew :composeApp:compileKotlinIosArm64 :composeApp:compileKotlinIosSimulatorArm64 --stacktrace

      - name: 5. 서버 테스트
        run: ./gradlew :server:test --stacktrace

      - name: 6. 공통 모듈 테스트 (shared + composeApp commonTest)
        run: ./gradlew :shared:jvmTest :composeApp:testAndroidHostTest --stacktrace

      - name: 6-1. Android UI 흐름(Robolectric) + 클라이언트–서버 통합 테스트
        run: ./gradlew :androidApp:testDebugUnitTest --stacktrace

      - name: 7. Android 디버그 빌드
        run: ./gradlew :androidApp:assembleDebug --stacktrace

      - name: 8. 정적 분석 (Android lint — 오류가 있으면 실패)
        run: ./gradlew :androidApp:lintDebug --stacktrace

      - name: 테스트 리포트 업로드 (실패 시 원인 확인용)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/build/reports/tests/
            **/build/test-results/
          if-no-files-found: ignore

      - name: 정적 분석 리포트 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: androidApp/build/reports/lint-results-debug.*
          if-no-files-found: ignore

      - name: 디버그 APK 업로드
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: androidApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error
